<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroChain - Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <!-- Background Animation -->
    <div class="background-animation">
        <div class="floating-icon" style="top: 10%; left: 10%;"><i class="fas fa-seedling"></i></div>
        <div class="floating-icon" style="top: 20%; left: 80%;"><i class="fas fa-leaf"></i></div>
        <div class="floating-icon" style="top: 70%; left: 20%;"><i class="fas fa-tractor"></i></div>
        <div class="floating-icon" style="top: 80%; left: 70%;"><i class="fas fa-wheat-awn"></i></div>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">
            <!-- Logo Section -->
            <div class="logo-section">
                <a href="index.html" class="logo-link">
                    <div class="logo">
                        <i class="fas fa-seedling"></i>
                    </div>
                    <h1>AgroChain</h1>
                </a>
                <p class="subtitle">Direct Agricultural Marketplace</p>
            </div>

            <!-- Error Banner -->
            <div id="loginAlert" class="alert-box" style="display: none;"></div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form" novalidate>
                <div class="form-group">
                    <label for="loginInput">Email or Phone Number</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="text" id="loginInput" name="loginInput" placeholder="name@example.com or phone"
                            required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required
                            autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePasswordBtn"
                            aria-label="Toggle password visibility">
                            <i class="fas fa-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span id="loginBtnText">Sign In</span>
                </button>
            </form>

            <div class="additional-options">
                <p>Don't have an account? <a href="register.html" class="signup-link">Create Account</a></p>
                <p style="margin-top: 10px;"><a href="index.html" class="home-link"><i class="fas fa-arrow-left"></i>
                        Back to Home</a></p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
